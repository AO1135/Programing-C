<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6d5dfc">
  <meta name="description" content="C言語をゼロから実践レベルまで学べるブラウザ学習アプリ">
  <title>C STEP LAB | C言語練習</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="orb orb1"></div><div class="orb orb2"></div>
<header class="topbar">
  <div class="brand"><div class="logo">C</div><div><h1>C STEP LAB</h1><p>ゼロから、コードを書ける自分へ。</p></div></div>
  <button id="resetBtn" class="ghost danger">↻ 進捗リセット</button>
</header>
<main>
  <section id="home">
    <div class="hero panel">
      <div><span class="eyebrow">LEARN · PRACTICE · LEVEL UP</span><h2>C言語をゲーム感覚で<br><span>一歩ずつマスター。</span></h2><p>好きなレベルからスタート。問題を解いてXPを集め、最高ランクを目指そう。</p></div>
      <div class="rank-card"><small>CURRENT RANK</small><div id="heroRank" class="rank-letter">C</div><div class="xp-track"><i id="xpBar"></i></div><span id="rankNext"></span></div>
    </div>
    <div id="stats" class="stats"></div>
    <div class="section-title"><div><span class="eyebrow">COURSE MAP</span><h2>学習レベルを選ぶ</h2></div><span id="saveState" class="save-pill">● 端末に自動保存</span></div>
    <div id="levels" class="levels"></div>
  </section>

  <section id="quiz" class="panel quiz hidden">
    <div class="quiz-top"><button id="backBtn" class="ghost">← コース一覧</button><div class="streak" id="streak">🔥 0 COMBO</div></div>
    <div class="quizHead"><span id="levelBadge" class="badge"></span><span id="progress"></span></div>
    <div class="progress-track"><i id="questionBar"></i></div>
    <h2 id="question"></h2>
    <pre id="code" class="hidden"><div class="code-head"><span></span><span></span><span></span><em>C</em></div><code></code></pre>
    <div id="choices"></div>
    <textarea id="answer" class="hidden" spellcheck="false" placeholder="ここにCコードを書いてください"></textarea>
    <div class="actions"><button id="submitBtn" class="primary">答え合わせ ✓</button><button id="nextBtn" class="primary hidden">次の問題 →</button></div>
    <div id="feedback" class="feedback hidden"></div>
  </section>
</main>
<footer><strong>C STEP LAB</strong><span>学習データはこの端末のブラウザ内だけに保存されます。</span></footer>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body></html>
