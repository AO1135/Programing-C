<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#705cff"><meta name="description" content="C言語をゼロから実践まで学べる端末保存型ブラウザ学習アプリ"><title>C STEP LAB MAX</title><link rel="stylesheet" href="style.css"></head><body>
<div class="orb o1"></div><div class="orb o2"></div><header><div class="brand"><div class="logo">C</div><div><h1>C STEP LAB <sup>MAX</sup></h1><p>ゼロから、書けるまで。</p></div></div><div class="head-actions"><button id="exportBtn" class="ghost">⇩ バックアップ</button><label class="ghost file">⇧ 復元<input id="importFile" type="file" accept="application/json"></label><button id="resetBtn" class="ghost danger">↻ リセット</button></div></header>
<main><section id="home"><div class="hero panel"><div><span class="eyebrow">LEARN · PRACTICE · MASTER</span><h2>C言語を、<span>ゲームみたいに。</span></h2><p>3,000問＋実行結果採点・復習・模擬試験・実績・デイリーミッション。進捗はこの端末だけに保存されます。</p><div class="hero-actions"><button id="continueBtn" class="primary">▶ おまかせ学習</button><button id="reviewBtn" class="secondary">↻ 間違い復習</button><button id="examBtn" class="secondary">⏱ 模擬試験</button></div></div><div class="rank-card"><small>CURRENT RANK</small><div id="heroRank" class="rank-letter">C</div><div class="xp-track"><i id="xpBar"></i></div><span id="rankNext"></span></div></div>
<div id="stats" class="stats"></div><div class="grid2"><section class="panel daily"><div class="section-title"><div><span class="eyebrow">TODAY</span><h2>デイリーミッション</h2></div><span id="dailyBadge" class="pill"></span></div><div id="daily"></div></section><section class="panel"><div class="section-title"><div><span class="eyebrow">ACHIEVEMENTS</span><h2>実績</h2></div><span id="achievementCount" class="pill"></span></div><div id="achievements" class="achievements"></div></section></div>
<div class="section-title"><div><span class="eyebrow">COURSE MAP</span><h2>好きなレベルから始める</h2></div><span class="save-pill">● 端末に自動保存</span></div><div id="levels" class="levels"></div><section class="panel analytics"><div class="section-title"><div><span class="eyebrow">ANALYTICS</span><h2>学習分析</h2></div></div><div id="analytics"></div></section></section>
<section id="quiz" class="panel quiz hidden"><div class="quiz-top"><button id="backBtn" class="ghost">← ホーム</button><div><span id="modeBadge" class="pill"></span> <span class="streak" id="streak"></span></div></div><div class="quizHead"><span id="levelBadge" class="badge"></span><span id="progress"></span></div><div class="progress-track"><i id="questionBar"></i></div><h2 id="question"></h2><pre id="code" class="hidden"><div class="code-head"><span></span><span></span><span></span><em>C</em></div><code></code></pre><div id="choices"></div><textarea id="answer" class="hidden" spellcheck="false"></textarea><div class="actions"><button id="hintBtn" class="ghost">💡 ヒント</button><button id="submitBtn" class="primary">答え合わせ ✓</button><button id="nextBtn" class="primary hidden">次の問題 →</button></div><div id="hint" class="hint hidden"></div><div id="feedback" class="feedback hidden"></div></section>
<section id="examResult" class="panel hidden result"><span class="eyebrow">EXAM RESULT</span><h2>模擬試験結果</h2><div id="examScore" class="big-score"></div><div id="examBreakdown"></div><button id="resultHome" class="primary">ホームへ</button></section></main><footer><strong>C STEP LAB MAX</strong><span>サーバー送信なし・localStorage保存</span></footer><div id="toast" class="toast hidden"></div><script src="https://felixhao28.github.io/JSCPP/dist/JSCPP.es5.min.js"></script><script src="app.js"></script></body></html>
